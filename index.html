<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Созвездие — конструктор компетенций юного инженера (1–4 класс)</title>
<meta name="description" content="Игра-тестирование для 1–4 классов: 8 инженерных миров, суперсилы Hard и Soft skills и индивидуальный план развития.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
:root{
  --sky1:#7FD3F7; --sky2:#CDEFFF; --grass:#5DBB46; --grass-d:#3E8F2E; --dirt:#9A6A3F; --dirt-d:#6E4A2A;
  --ink:#1B2440; --ink2:#46506E; --paper:#FFFDF6; --paper2:#F4F1E4; --gold:#FFC83D; --gold-d:#D69A0F;
  --orange:#FF7A2F; --blue:#3A8DDE; --blue-d:#2463A3; --red:#E8453C; --green:#49B55A; --violet:#8B5CF6;
  --night:#1A2350; --night2:#2A3570; --hard:#3A8DDE; --soft:#49B55A;
  --f-head:'Russo One','Arial Black',system-ui,sans-serif; --f-body:'Nunito','Trebuchet MS',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--f-body);color:var(--ink);font-size:17px;line-height:1.45;background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 70%,#E9F8FF 100%);min-height:100vh}
button{font-family:inherit}
:focus-visible{outline:4px solid var(--orange);outline-offset:2px}
h1,h2,h3{font-family:var(--f-head);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
a{color:var(--blue-d)}
.world{position:relative;max-width:980px;margin:0 auto;padding:18px 16px 110px}
.clouds{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.cloud{position:absolute;width:120px;height:36px;background:#fff;opacity:.85;box-shadow:24px -16px 0 0 #fff,56px -16px 0 0 #fff,80px 0 0 0 #fff,40px 0 0 0 #fff}
.cloud.c1{top:70px;left:-160px;animation:drift 70s linear infinite}
.cloud.c2{top:170px;left:-160px;animation:drift 95s linear infinite;animation-delay:-40s;transform:scale(.7)}
.cloud.c3{top:40px;left:-160px;animation:drift 120s linear infinite;animation-delay:-80s;transform:scale(.5)}
@keyframes drift{to{left:110%}}
.ground{position:fixed;left:0;right:0;bottom:0;height:64px;z-index:0;pointer-events:none;
  background:linear-gradient(var(--grass) 0 18px,var(--grass-d) 18px 22px,var(--dirt) 22px);
  background-size:100% 100%}
.ground:before{content:"";position:absolute;inset:22px 0 0;background:repeating-linear-gradient(90deg,transparent 0 30px,rgba(0,0,0,.08) 30px 32px),repeating-linear-gradient(0deg,transparent 0 20px,rgba(0,0,0,.08) 20px 22px)}
.top{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.logo{display:flex;align-items:center;gap:10px}
.logo .cube{width:38px;height:38px;background:var(--gold);border:3px solid var(--ink);box-shadow:inset -6px -6px 0 var(--gold-d),0 4px 0 var(--ink);display:grid;place-items:center;font-size:20px}
.logo b{font-family:var(--f-head);font-weight:400;font-size:22px}
.logo small{display:block;font-size:12px;font-weight:700;color:var(--ink2)}
.pill{font-family:var(--f-head);font-size:13px;background:var(--paper);border:3px solid var(--ink);padding:3px 10px;box-shadow:0 3px 0 var(--ink)}
.card{position:relative;z-index:1;background:var(--paper);border:3px solid var(--ink);border-radius:14px;box-shadow:0 6px 0 var(--ink);padding:22px}
.hud{position:relative;z-index:1;display:flex;align-items:center;gap:10px;margin-bottom:12px}
.hud .hero-mini{width:46px;height:46px;flex:none}
.hotbar{flex:1;display:grid;gap:3px;background:var(--ink);padding:4px;border-radius:8px}
.hotbar i{height:18px;background:#5B6690;border-radius:2px;position:relative}
.hotbar i.on{background:var(--gold);box-shadow:inset -3px -3px 0 var(--gold-d)}
.hotbar i.on.lvl{background:var(--orange);box-shadow:inset -3px -3px 0 #C4551A}
.hud-txt{font-family:var(--f-head);font-size:14px;white-space:nowrap;background:var(--paper);border:3px solid var(--ink);padding:4px 8px;box-shadow:0 3px 0 var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:10px 22px;border:3px solid var(--ink);border-radius:10px;background:var(--gold);color:var(--ink);font-family:var(--f-head);font-size:18px;cursor:pointer;box-shadow:inset -5px -5px 0 var(--gold-d),0 5px 0 var(--ink);transition:transform .08s;text-decoration:none}
.btn:active{transform:translateY(3px);box-shadow:inset -5px -5px 0 var(--gold-d),0 2px 0 var(--ink)}
.btn:disabled{filter:grayscale(.8) brightness(.95);cursor:not-allowed}
.btn.green{background:var(--green);color:#fff;box-shadow:inset -5px -5px 0 var(--grass-d),0 5px 0 var(--ink)}
.btn.blue{background:var(--blue);color:#fff;box-shadow:inset -5px -5px 0 var(--blue-d),0 5px 0 var(--ink)}
.btn.white{background:#fff;box-shadow:inset -5px -5px 0 #D9D6C8,0 5px 0 var(--ink)}
.btn.small{min-height:42px;font-size:15px;padding:6px 14px}
.btn.link{background:none;border:0;box-shadow:none;color:var(--blue-d);font-family:var(--f-body);font-weight:800;font-size:16px;min-height:40px;padding:6px 8px;text-decoration:underline}
.row{display:flex;gap:12px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.center{text-align:center}
.muted{color:var(--ink2)}
.small{font-size:14px}
.eyebrow{font-family:var(--f-head);font-size:13px;letter-spacing:.06em;color:var(--orange);text-transform:uppercase;margin-bottom:6px}
.fade{animation:pop .28s ease both}
@keyframes pop{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}
/* старт */
.start{display:grid;gap:20px;align-items:center}
.start h1{font-size:clamp(34px,6vw,54px);line-height:1.05}
.start .subt{font-family:var(--f-head);font-size:18px;color:var(--blue-d);margin-top:6px}
.start-art{display:flex;justify-content:center;gap:10px;align-items:flex-end}
.start-art svg{width:110px;height:auto}
@media (min-width:760px){.start{grid-template-columns:1.2fr 1fr}}
/* выбор */
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:10px}
.seg button{min-height:62px;border:3px solid var(--ink);border-radius:10px;background:#fff;font-family:var(--f-head);font-size:22px;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.seg button small{display:block;font-family:var(--f-body);font-size:13px;font-weight:700;color:var(--ink2)}
.seg button.sel{background:var(--gold);box-shadow:inset -4px -4px 0 var(--gold-d),0 4px 0 var(--ink)}
.seg.school{grid-template-columns:1fr 1fr}
.seg.school button{font-size:17px;padding:8px}
.heroes{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.heroes button{border:3px solid var(--ink);border-radius:10px;background:#fff;padding:6px 2px;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.heroes button.sel{background:var(--gold)}
.heroes svg{width:100%;height:auto;max-width:64px}
.inp{width:100%;min-height:52px;border:3px solid var(--ink);border-radius:10px;padding:10px 12px;font-size:18px;font-family:var(--f-body);background:#fff}
.field{margin-top:16px}
.label{font-family:var(--f-head);font-size:16px;margin-bottom:8px;display:block}
/* вопрос */
.qhead{display:flex;align-items:flex-start;gap:10px;margin:6px 0 18px}
.qtext{font-family:var(--f-head);font-size:clamp(22px,3.6vw,30px);line-height:1.2;flex:1}
.speak{flex:none;width:52px;height:52px;border:3px solid var(--ink);border-radius:10px;background:#fff;font-size:24px;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:150px;padding:14px 10px;border:3px solid var(--ink);border-radius:12px;background:#fff;cursor:pointer;box-shadow:0 5px 0 var(--ink);font-size:17px;font-weight:800;text-align:center;line-height:1.25;transition:transform .08s}
.tile .ic{width:72px;height:72px;display:grid;place-items:center;font-size:42px;background:var(--paper2);border:3px solid var(--ink);border-radius:8px;box-shadow:inset -5px -5px 0 #DDD8C2}
.tile:hover{transform:translateY(-2px)}
.tile.sel{background:var(--gold);box-shadow:inset -5px -5px 0 var(--gold-d),0 5px 0 var(--ink)}
.tiles.picks{grid-template-columns:repeat(2,1fr)}
.tiles.picks .tile{min-height:120px;font-size:16px}
.tiles.picks .tile .ic{width:58px;height:58px;font-size:32px}
@media (min-width:760px){.tiles{grid-template-columns:repeat(4,1fr)}.tiles.picks{grid-template-columns:repeat(4,1fr)}}
.scale3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scale3 button{min-height:150px;border:3px solid var(--ink);border-radius:12px;background:#fff;cursor:pointer;box-shadow:0 5px 0 var(--ink);font-weight:800;font-size:17px}
.scale3 button span{display:block;font-size:52px;margin-bottom:6px}
.scale3 button.sel{background:var(--gold)}
.chip{display:inline-block;font-family:var(--f-head);font-size:13px;padding:4px 10px;border:3px solid var(--ink);border-radius:8px;background:var(--paper2)}
.chip.blue{background:var(--blue);color:#fff}
.chip.green{background:var(--green);color:#fff}
.chip.orange{background:var(--orange);color:#fff}
.levelup{text-align:center;padding:26px 10px}
.levelup .big{font-family:var(--f-head);font-size:34px;color:var(--orange);-webkit-text-stroke:1px var(--ink)}
/* результат */
.res-head{display:grid;gap:16px;align-items:center}
@media (min-width:760px){.res-head{grid-template-columns:auto 1fr}}
.res-head .hero-big{width:130px;margin:0 auto}
.sec{margin-top:18px}
.sec-t{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sec-t .n{width:36px;height:36px;flex:none;display:grid;place-items:center;font-family:var(--f-head);font-size:18px;background:var(--orange);color:#fff;border:3px solid var(--ink);border-radius:6px;box-shadow:inset -3px -3px 0 #C4551A}
.sec-t h2{font-size:22px}
.skyp{background:var(--night);border:3px solid var(--ink);border-radius:12px;padding:12px;display:grid;gap:14px;align-items:center;color:#fff}
@media (min-width:640px){.skyp{grid-template-columns:220px 1fr}}
.skyp .const{width:200px;height:200px;margin:0 auto;display:block}
.skyp h3{font-size:26px;color:var(--gold)}
.skyp .bigdirs{font-size:13px;color:#C9D1F5;margin-top:8px}
.also{display:grid;gap:10px;margin-top:10px}
@media (min-width:640px){.also{grid-template-columns:1fr 1fr}}
.also div{background:#fff;border:3px solid var(--ink);border-radius:10px;padding:10px 12px;font-weight:800}
.also small{display:block;font-weight:600;color:var(--ink2)}
.profs{display:grid;gap:10px}
@media (min-width:640px){.profs{grid-template-columns:1fr 1fr}}
.prof{background:#fff;border:3px solid var(--ink);border-radius:10px;padding:10px 12px}
.prof b{display:block}
.powers{display:grid;gap:12px}
@media (min-width:640px){.powers{grid-template-columns:1fr 1fr}}
.pw{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:12px}
.pw h3{font-size:17px;margin-bottom:8px}
.pw.hard h3{color:var(--blue-d)}
.pw.soft h3{color:var(--grass-d)}
.bar{margin:8px 0}
.bar .bl{display:flex;justify-content:space-between;font-weight:800;font-size:15px;gap:8px}
.bar .bt{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin-top:4px}
.bar .bt i{height:16px;border:2px solid var(--ink);background:#EDEAE0}
.pw.hard .bt i.on{background:var(--hard)}
.pw.soft .bt i.on{background:var(--soft)}
.bar.grow .bt i.on{background:var(--orange)}
.tag{display:inline-block;font-size:12px;font-weight:800;background:var(--orange);color:#fff;border-radius:6px;padding:1px 7px;border:2px solid var(--ink)}
.type{margin-top:12px;background:var(--gold);border:3px solid var(--ink);border-radius:12px;padding:12px;box-shadow:inset -5px -5px 0 var(--gold-d)}
.type h3{font-size:20px}
.quest{display:grid;gap:12px}
@media (min-width:760px){.quest{grid-template-columns:1fr 1fr}}
.quest h3{font-size:18px;margin-bottom:8px}
.qlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.qlist li{background:#fff;border:3px solid var(--ink);border-radius:10px;padding:9px 12px 9px 46px;position:relative;font-weight:700}
.qlist li:before{content:"";position:absolute;left:10px;top:10px;width:22px;height:22px;border:3px solid var(--ink);border-radius:4px;background:var(--paper2)}
.qlist li em{display:block;font-style:normal;font-weight:600;font-size:13px;color:var(--ink2)}
.qlist .qc{display:inline-block;font-size:12px;font-weight:800;border-radius:6px;padding:0 6px;margin-right:6px;border:2px solid var(--ink);background:var(--paper2)}
.qc.hard{background:var(--hard);color:#fff}
.qc.soft{background:var(--soft);color:#fff}
.qc.olymp{background:var(--gold)}
.home{margin-top:12px;background:#E8F6E3;border:3px solid var(--ink);border-radius:12px;padding:12px}
.kv{background:#fff;border:3px solid var(--ink);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.kv .k{font-family:var(--f-head);font-size:13px;color:var(--orange);margin-bottom:4px}
.kv small{display:block;color:var(--ink2);font-size:13px}
.olist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.olist li{background:#fff;border:3px solid var(--ink);border-radius:10px;padding:9px 12px;font-weight:700}
.olist li small{display:block;font-weight:600;color:var(--ink2);font-size:13px}
.olist li.dim{opacity:.6}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px}
.fb{display:grid;gap:14px}
.fb .q{font-weight:800;margin-bottom:6px}
.fb .o{display:flex;gap:8px;flex-wrap:wrap}
.fb .o button{border:3px solid var(--ink);border-radius:10px;background:#fff;padding:8px 14px;font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.fb .o button.sel{background:var(--gold)}
.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);z-index:50;max-width:min(560px,92vw);background:#fff;border:3px solid var(--ink);border-radius:12px;box-shadow:0 5px 0 var(--ink);padding:12px 40px 12px 14px;font-weight:700}
.toast .x{position:absolute;right:8px;top:6px;border:0;background:none;font-size:20px;cursor:pointer}
.flyblock{position:fixed;z-index:60;width:22px;height:22px;background:var(--gold);border:3px solid var(--ink);pointer-events:none}
.qrbox{background:#fff;border:3px solid var(--ink);border-radius:10px;padding:10px;width:220px;height:220px;margin:10px auto}
.qrbox.big{width:min(300px,78vw);height:min(300px,78vw)}
.qrbox svg{width:100%;height:100%;display:block}
.dadd{display:grid;gap:12px;margin-top:12px}
@media (min-width:760px){.dadd{grid-template-columns:repeat(3,1fr)}}
.dadd .kv textarea{width:100%;border:3px solid var(--ink);border-radius:8px;padding:8px;font-family:inherit;font-size:14px}
.scanbox{display:none;margin-top:8px}.scanbox.on{display:block}
.scanbox video{width:100%;max-width:340px;border:3px solid var(--ink);border-radius:8px;background:#000}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
@media (min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpis div{background:#fff;border:3px solid var(--ink);border-radius:10px;padding:10px}
.kpis b{display:block;font-family:var(--f-head);font-size:28px;color:var(--orange)}
.kpis span{font-size:13px;font-weight:700;color:var(--ink2)}
.dgrid{display:grid;gap:12px;margin-top:12px}
@media (min-width:760px){.dgrid{grid-template-columns:1fr 1fr}}
.dgrid h3{font-size:17px;margin-bottom:8px}
.dbar{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(60px,1fr) 70px;gap:8px;align-items:center;font-size:14px;font-weight:700;margin:6px 0}
.dt{height:14px;border:2px solid var(--ink);background:#EDEAE0}
.dt i{display:block;height:100%;background:var(--gold)}
.dv{text-align:right;font-variant-numeric:tabular-nums}
.dfilter{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px;font-weight:700}
.dfilter select{border:3px solid var(--ink);border-radius:8px;padding:6px;font-family:inherit;font-weight:700;background:#fff}
.dtable{overflow-x:auto}
.dtable table{border-collapse:collapse;width:100%;font-size:14px}
.dtable th,.dtable td{border-bottom:2px solid #E3DFCF;padding:6px 8px;text-align:left;white-space:nowrap}
.foot{position:relative;z-index:1;text-align:center;font-size:13px;font-weight:700;color:var(--ink2);margin-top:16px}
.back{margin-bottom:10px}
@media (prefers-reduced-motion:reduce){.cloud,.fade{animation:none}}
/* документ для PDF и печати */
#printSheet{display:none}
.pdf-holder{position:fixed;left:-12000px;top:0;width:718px;background:#fff;z-index:-1}
.pdoc{font-family:'Nunito',Arial,sans-serif;color:#1B2440;background:#fff;padding:6px 10px;font-size:13px;line-height:1.45;max-width:718px}
.pdoc h1{font-family:'Russo One',Arial,sans-serif;font-weight:400;font-size:21px;margin:4px 0}
.pdoc h2{font-family:'Russo One',Arial,sans-serif;font-weight:400;font-size:15px;margin:14px 0 6px;color:#C4551A}
.pdoc h3{font-size:13.5px;margin:8px 0 4px}
.pdoc p{margin:4px 0}.pdoc ul,.pdoc ol{margin:4px 0;padding-left:20px}.pdoc li{margin:3px 0}
.pdoc .ph{border:3px solid #1B2440;border-radius:10px;background:#FFF6D8;padding:8px 12px;display:flex;gap:12px;align-items:center}
.pdoc .ph svg{width:70px;height:70px;flex:none}
.pdoc .pbrand{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#C4551A}
.pdoc .pmeta{color:#46506E}
.pdoc .ptwo{display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:14px;align-items:start}
.pdoc .const{width:160px;height:160px;background:#1A2350;border-radius:10px}
.pdoc .pnote{background:#F4F1E4;border-radius:8px;padding:8px 10px;font-size:11.5px;margin-top:10px}
.pdoc .pfoot{margin-top:12px;font-size:10.5px;color:#666;border-top:1px solid #ddd;padding-top:6px}
.pdoc .ptbl{border-collapse:collapse;width:100%}.pdoc .ptbl td{border-bottom:1px solid #ddd;padding:4px 6px}
.pdoc.poster{text-align:center;padding-top:30px}
.pdoc.poster h1{font-size:30px}
.pdoc.poster .big{font-size:18px;max-width:560px;margin:14px auto}
.pdoc.poster .pqr{width:330px;height:330px;margin:20px auto}.pdoc.poster .pqr svg{width:100%;height:100%}
@media print{
  body{background:#fff}
  .world,.clouds,.ground{display:none!important}
  #printSheet{display:block}
  #printSheet .pdoc{max-width:180mm;margin:0 auto}
  #printSheet .pbreak{page-break-before:always;break-before:page}
}

</style>
</head>

<div class="clouds" aria-hidden="true"><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div></div>
<div class="ground" aria-hidden="true"></div>
<div class="world">
  <header class="top"><div class="logo"><div class="cube" aria-hidden="true">★</div><div><b>Созвездие</b><small>Конструктор компетенций юного инженера</small></div></div><span class="pill">1–4 класс</span></header>
  <div class="hud" id="hud" hidden></div>
  <main id="view"></main>
  <p class="foot">Проект ученика 4 класса ГБОУ «ИТШ № 777», Санкт-Петербург</p>
</div>
<div id="printSheet"></div>

function b64u(s){ return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }

    st.answers.map(a=>a==null?'x':a).join('')+st.picks.map(id=>String.fromCharCode(96+id)).join('')+st.skills.map(v=>v==null?'x':v).join('')+
    DATA.feedback.map(f=>st.fb[f.id]==null?'x':st.fb[f.id]).join('');
  const e={}; if(st.school!=='itsh'&&st.city) e.c=st.city; if(st.klass) e.k=st.klass;

  const [body,ext]=m[0].split('.'); const grade=+body[2], school=body[3]==='i'?'itsh':'any', before=body[4]==='x'?null:+body[4], hero=body[5];
  let p=6; const answers=[...body.slice(p,p+Q.length)].map(x=>x==='x'?null:+x); p+=Q.length;
  const picks=[...body.slice(p,p+2)].map(ch=>ch.charCodeAt(0)-96); p+=2;

const S={screen:'start',grade:null,school:null,city:'',klass:(PARAMS.get('k')||'').slice(0,24),name:'',hero:'o',before:null,qi:0,si:0,answers:[],picks:[],skills:[],fb:{},fbSent:false,order:null};
function newRun(){ Object.assign(S,{qi:0,si:0,answers:Array(Q.length).fill(null),picks:[],skills:Array(ST.length).fill(null),fb:{},fbSent:false});
  let x=(Date.now()>>>0)||1; const rnd=()=>{x^=x<<13;x^=x>>>17;x^=x<<5;return ((x>>>0)%1000)/1000;};
  S.order=Q.map(q=>{ const a=q.options.map((_,i)=>i); for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }); }
function done(){ return S.skills.length&&S.skills.every(v=>v!=null)&&S.picks.length===2; }
const view=document.getElementById('view'), hud=document.getElementById('hud');
function go(s){ S.screen=s; render(); window.scrollTo({top:0,behavior:REDUCED?'auto':'smooth'}); }
function answered(){ return S.answers.filter(a=>a!=null).length+(S.picks.length===2?1:0)+S.skills.filter(v=>v!=null).length; }
function renderHud(show){
  if(!show){ hud.innerHTML=''; hud.hidden=true; return; } hud.hidden=false;
  const n=answered(); let slots=''; for(let i=0;i<TOTAL;i++) slots+='<i class="'+(i<n?'on':'')+(i<n&&(i+1)%5===0?' lvl':'')+'"></i>';
  hud.innerHTML='<div class="hero-mini">'+heroSVG(S.hero)+'</div><div class="hotbar" id="hotbar" style="grid-template-columns:repeat('+TOTAL+',1fr)">'+slots+'</div><div class="hud-txt">'+Math.min(n+1,TOTAL)+' / '+TOTAL+'</div>';
}
function flyBlock(el){ if(REDUCED||!el) return; const slot=document.querySelector('#hotbar i:nth-child('+(answered()+1)+')'); if(!slot) return;
  const a=el.getBoundingClientRect(), b=slot.getBoundingClientRect(), d=document.createElement('div'); d.className='flyblock';
  d.style.left=(a.left+a.width/2-11)+'px'; d.style.top=(a.top+a.height/2-11)+'px'; document.body.appendChild(d);
  d.animate([{transform:'translate(0,0) rotate(0)'},{transform:'translate('+(b.left+b.width/2-a.left-a.width/2)+'px,'+(b.top+b.height/2-a.top-a.height/2)+'px) rotate(180deg) scale(.6)'}],{duration:420,easing:'cubic-bezier(.2,.8,.2,1)'}).onfinish=()=>d.remove(); }
function speak(text){ try{ if(!('speechSynthesis' in window)) throw 0; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang='ru-RU'; u.rate=.95;
  const v=speechSynthesis.getVoices().find(v=>/^ru/i.test(v.lang)); if(v) u.voice=v; speechSynthesis.speak(u); }catch(e){ toast('На этом устройстве озвучка недоступна — попроси взрослого прочитать вопрос.'); } }

function dFiltered(){ return DASH.items.filter(x=>(!DASH.fK||x.klass===DASH.fK)&&(!DASH.fG||String(x.grade)===DASH.fG)); }
function stats(items){
  const O=()=>Object.create(null), tr=O(), prof=O(), types=O(), hard={T:0,D:0}, soft={M:0,K:0}, grades=O(), before=[0,0,0], fb=O(); DATA.feedback.forEach(f=>fb[f.id]=[0,0,0]);
  for(const it of items){ const rk=rank(it.answers,it.picks), avg=averages(it.skills), top=TR[rk[0].id];
    tr[top.id]=(tr[top.id]||0)+1; top.profs.forEach(p=>{const n=p.split(' — ')[0]; prof[n]=(prof[n]||0)+1;}); const ty=engType(avg); types[ty]=(types[ty]||0)+1;
    const hd=weakest(avg,HARD), sd=weakest(avg,SOFT); hard[hd]++; soft[sd]++; grades[it.grade]=(grades[it.grade]||0)+1; if(it.before!=null) before[it.before]++;
    DATA.feedback.forEach(f=>{ if(it.fb[f.id]!=null) fb[f.id][it.fb[f.id]]++; }); Object.assign(it,{_top:top,_type:ty,_hd:hd,_sd:sd,_avg:avg}); }
  return {n:items.length,tr,prof,types,hard,soft,grades,before,fb};
}

async function dashFiles(fs){
  FILE_OTHER=false;
  let c=[], noX=false, used=0;
  for(const f of fs){ if(!FILE_RE.test(f.name)) continue; used++; try{ c=c.concat(await fileCodes(f)); }catch(e){ if(e&&e.message==='noxlsx') noX=true; } }
  if(noX){ toast('Этот браузер не читает XLSX. Скачайте ответы формы в формате CSV.'); return; }
  if(!used){ toast('Нужен файл XLSX, CSV или JSON.'); return; }
  const r=dAdd(c); render();
  toast(c.length?'Добавлено: '+r.a+(r.d?' · повторов: '+r.d:'')+(r.b?' · не распознано: '+r.b:''):(FILE_OTHER?'Это выгрузка '+OTHER_NAME+'. Загрузите её в «Результаты класса» того сайта.':'В файле не найдено результатов «Созвездия».'));
}

const SCAN={on:false,stream:null,raf:null,det:null,last:''};
function loadScript(srcs){ return new Promise((res,rej)=>{ const l=[].concat(srcs); const nx=i=>{ if(i>=l.length) return rej(); const s=document.createElement('script'); s.src=l[i]; s.onload=res; s.onerror=()=>{s.remove();nx(i+1);}; document.head.appendChild(s); }; nx(0); }); }
async function scanStart(){ try{ SCAN.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}}}); }catch(e){ toast('Нет доступа к камере. Добавьте результаты файлами или ссылками.'); return; }
  if('BarcodeDetector' in window){ try{ SCAN.det=new BarcodeDetector({formats:['qr_code']}); }catch(e){} }
  if(!SCAN.det&&!window.jsQR){ try{ await loadScript(['lib/jsqr.min.js','jsqr.min.js','https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js']); }catch(e){ toast('Не удалось загрузить сканер.'); scanStop(); return; } }
  SCAN.note=''; SCAN.on=true; render(); }
function scanAttach(){ const v=document.getElementById('scanVideo'); if(!v||!SCAN.stream) return; v.srcObject=SCAN.stream; v.play().catch(()=>{});
  const c=document.createElement('canvas'), x=c.getContext('2d',{willReadFrequently:true}), msg=document.getElementById('scanMsg'); if(msg) msg.textContent=SCAN.note||'Камера включена. Наведите её на «QR для учителя» на экране ученика с расстояния 20–40 см.';
  const tick=async()=>{ if(!SCAN.on) return; if(v.readyState>=2){ let t='';
    try{ if(SCAN.det){ const r=await SCAN.det.detect(v); if(r[0]) t=r[0].rawValue; } else { c.width=v.videoWidth; c.height=v.videoHeight; x.drawImage(v,0,0); const r=window.jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height); if(r) t=r.data; } }catch(e){}
    if(t&&t!==SCAN.last){ SCAN.last=t; const r=dAdd(extractCodes(t)); if(msg) msg.textContent=SCAN.note=scanText(t,r.a,r.d); if(r.a){ setTimeout(()=>{ if(SCAN.on) render(); },700); return; } } }
    SCAN.raf=requestAnimationFrame(tick); }; SCAN.raf=requestAnimationFrame(tick); }
function scanStop(){ SCAN.on=false; cancelAnimationFrame(SCAN.raf); if(SCAN.stream) SCAN.stream.getTracks().forEach(t=>t.stop()); SCAN.stream=null; }

function inlineSvg(root){ root.querySelectorAll('svg').forEach(svg=>{ const cs=getComputedStyle(svg); svg.setAttribute('width',parseFloat(cs.width)||120); svg.setAttribute('height',parseFloat(cs.height)||120); }); }
async function doPDF(){ const html=planDoc(); document.getElementById('printSheet').innerHTML=html; toast('Готовим PDF…');
  try{ if(!window.html2pdf) await loadScript(['lib/html2pdf.bundle.min.js','html2pdf.bundle.min.js','https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js']);
    const y=window.scrollY; window.scrollTo(0,0); const h=document.createElement('div'); h.className='pdf-holder'; h.innerHTML=html; document.body.appendChild(h); inlineSvg(h);
    await window.html2pdf().set({margin:[10,10,12,10],filename:'Plan_Sozvezdie_1-4_'+S.grade+'kl.pdf',image:{type:'jpeg',quality:.95},html2canvas:{scale:2,backgroundColor:'#ffffff',scrollX:0,scrollY:0},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['avoid-all']}}).from(h.firstChild).save();
    h.remove(); window.scrollTo(0,y); toast('PDF сохранён в «Загрузки».'); }catch(e){ toast('Откроется печать — выберите «Сохранить как PDF».'); setTimeout(()=>{try{window.print();}catch(_){}},300); } }
function doPoster(){ const link=baseUrl()+(S.klass?'?k='+encodeURIComponent(S.klass):'');
  document.getElementById('printSheet').innerHTML='<div class="pdoc poster"><div class="pbrand">Созвездие · 1–4 класс</div><h1>Конструктор компетенций юного инженера</h1><p class="big">Наведи камеру на код, пройди игру-тестирование и получи свой план развития юного инженера!</p><div class="pqr">'+qrSVG(link,8)+'</div><p>'+esc(link)+'</p>'+(S.klass?'<p>Класс: '+esc(S.klass)+'</p>':'')+'</div>';
  setTimeout(()=>{try{window.print();}catch(e){}},80); }
function dashPrint(){ const s=stats(dFiltered()), n=s.n, tb=(t,rows)=>'<h2>'+t+'</h2><table class="ptbl">'+rows.map(r=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+pct(r[1],n)+'%</td></tr>').join('')+'</table>';
  document.getElementById('printSheet').innerHTML='<div class="pdoc"><div class="pbrand">Созвездие · 1–4 класс · результаты класса</div><h1>Участников: '+n+'</h1>'+tb('Направления',DATA.tracks.map(t=>[esc(t.name),s.tr[t.id]||0]))+tb('Что прокачать первым',[[BLOCK.T.name,s.hard.T],[BLOCK.D.name,s.hard.D],[BLOCK.M.name,s.soft.M],[BLOCK.K.name,s.soft.K]])+tb(esc(DATA.feedback[2].text),DATA.feedback[2].options.map((o,i)=>[o,s.fb.orient[i]]))+'</div>';
  setTimeout(()=>{try{window.print();}catch(e){}},80); }

/* ---------- события ---------- */
function copyText(t,ok){ const fb=()=>{ const a=document.createElement('textarea'); a.value=t; document.body.appendChild(a); a.select(); let r=false; try{r=document.execCommand('copy');}catch(e){} a.remove(); toast(r?ok:'Скопируйте: '+t); };
  try{ navigator.clipboard.writeText(t).then(()=>toast(ok)).catch(fb); }catch(e){ fb(); } }
async function doShare(){ const url=resultUrl(); if(navigator.share){ try{ await navigator.share({title:'Созвездие — мой план',text:'Мой план юного инженера: «'+compute(S).top.name+'»',url}); return; }catch(e){ if(e&&e.name==='AbortError') return; } } copyText(url,'Ссылка на план скопирована.'); }
function keep(){ const n=document.getElementById('nameIn'); if(n) S.name=n.value.trim().slice(0,20); const c=document.getElementById('cityIn'); if(c) S.city=c.value.trim().slice(0,40); }
function whoReady(){ return S.grade&&S.school&&(S.school!=='any'||normCity(S.city))&&S.before!=null; }
view.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; const d=b.dataset;
  if(d.hero){ keep(); S.hero=d.hero; render(); return; }
  if(d.grade){ keep(); S.grade=+d.grade; render(); return; }
  if(d.school){ keep(); S.school=d.school; render(); return; }
  if(d.before!=null){ keep(); S.before=+d.before; render(); return; }
  if(d.opt!=null){ if(STEP_LOCK) return; STEP_LOCK=true; S.answers[S.qi]=+d.opt; b.classList.add('sel'); flyBlock(b); setTimeout(()=>{ STEP_LOCK=false; if(S.qi<Q.length-1){S.qi++; go('q');} else go('pick'); },REDUCED?60:360); return; }
  if(d.pick!=null){ const t=+d.pick; if(S.picks.includes(t)) S.picks=S.picks.filter(x=>x!==t); else if(S.picks.length<2) S.picks.push(t); const y=window.scrollY; render(); window.scrollTo(0,y); if(S.picks.length===2) flyBlock(b); return; }
  if(d.val!=null){ if(STEP_LOCK) return; STEP_LOCK=true; S.skills[S.si]=+d.val; b.classList.add('sel'); flyBlock(b); setTimeout(()=>{ STEP_LOCK=false; if(S.si<ST.length-1){S.si++; go('skill');} else { go('building'); setTimeout(()=>{ if(S.screen==='building') go('result'); },REDUCED?500:2200); } },REDUCED?60:320); return; }
  if(d.fb){ S.fb[d.fb]=+d.fbv; const y=window.scrollY; render(); window.scrollTo(0,y); return; }
  switch(d.act){
    case 'start': newRun(); go('who'); break;
    case 'home': scanStop(); go(done()?'result':'start'); break;
    case 'about': go('about'); break; case 'teacher': go('teacher'); break;
    case 'dashboard': dLoad(); go('dashboard'); break;
    case 'who-next': keep(); if(whoReady()){ S.qi=0; go('q'); } break;
    case 'speak': speak(S.screen==='q'?Q[S.qi].text+'. '+S.order[S.qi].map(i=>Q[S.qi].options[i].text).join('. '):(S.screen==='skill'?ST[S.si].text+'. Не про меня. Иногда. Да, это я!':F.text+'. '+F.options.map(o=>o.text).join('. '))); break;
    case 'q-back': if(S.qi>0){ S.answers[S.qi]=null; S.qi--; S.answers[S.qi]=null; go('q'); } else go('who'); break;
    case 'pick-next': if(S.picks.length===2) go('levelup'); break;
    case 'pick-back': S.picks=[]; S.qi=Q.length-1; S.answers[S.qi]=null; go('q'); break;
    case 'level-next': S.si=0; go('skill'); break;
    case 'skill-back': if(S.si>0){ S.skills[S.si]=null; S.si--; S.skills[S.si]=null; go('skill'); } else go('levelup'); break;
    case 'to-result': go('result'); break;
    case 'restart': history.replaceState(null,'',location.pathname+location.search); Object.assign(S,{grade:null,school:null,city:'',name:'',before:null}); go('start'); break;
    case 'parent': go('parent'); break;
    case 'pdf': if(!previewOnly('Скачивание PDF')) doPDF(); break;
    case 'share': if(!previewOnly('«Поделиться»')) doShare(); break;
    case 'send': { S.formOpened=false; if(Object.keys(S.fb).length>=DATA.feedback.length){ const w=window.open(formLink(encodeResult(S)),'_blank'); if(w){ try{ w.opener=null; }catch(e){} } S.formOpened=!!w; } go('send'); } break;
    case 'dl': if(!previewOnly('Скачивание файла')) resultFile(); break;
    case 'copy-link': if(!previewOnly('Ссылка на результат')) copyText(resultUrl(),'Ссылка скопирована — отправьте её учителю.'); break;
    case 'myqr': go('myqr'); break;
    case 'fb-send': S.fbSent=true; { const y=window.scrollY; render(); window.scrollTo(0,y); } toast('Спасибо!'); break;
    case 'poster': if(!previewOnly('Печать плаката')) doPoster(); break;
    case 'copy-class': copyText(baseUrl()+(S.klass?'?k='+encodeURIComponent(S.klass):''),'Ссылка на тестирование скопирована.'); break;
    case 'scan': if(previewOnly('Сканирование камерой')) break; if(SCAN.on){ scanStop(); render(); } else scanStart(); break;
    case 'paste': { const r=dAdd(extractCodes(document.getElementById('dPaste').value)); render(); toast('Добавлено: '+r.a+(r.d?' · повторов: '+r.d:'')+(r.b?' · не распознано: '+r.b:'')); } break;
    case 'demo': { const out=[], rnd=n=>Math.floor(Math.random()*n); for(let i=0;i<26;i++){ const a=1+rnd(8); let c=1+rnd(8); if(c===a) c=a%8+1;
        out.push(encodeResult({grade:1+rnd(4),school:'itsh',city:'',klass:'пример',before:rnd(3),hero:'roygbv'[rnd(6)],answers:Q.map(q=>rnd(4)),picks:[a,c],skills:ST.map(()=>[1,3,5][rnd(3)]),fb:{process:rnd(3),plan:rnd(3),orient:rnd(3)}})); }
      dAdd(out); render(); } break;
    case 'csv': if(!previewOnly('Выгрузка CSV')) dashCSV(); break;
    case 'dash-print': if(!previewOnly('Печать')) dashPrint(); break;
    case 'dash-clear': DASH.items=[]; dSave(); render(); break;
  }
});
view.addEventListener('input',e=>{ const id=e.target.id;
  if(id==='nameIn') S.name=e.target.value;
  if(id==='cityIn'){ S.city=e.target.value; const g=document.getElementById('goBtn'), h=document.getElementById('goHint'); if(g) g.disabled=!whoReady(); if(h) h.textContent=whoReady()?'':'Выбери класс, школу, город и ответь на вопрос'; }
  if(id==='klassIn'){ S.klass=e.target.value.trim().slice(0,24); const q=document.getElementById('classQR'); if(q) q.innerHTML=qrSVG(baseUrl()+(S.klass?'?k='+encodeURIComponent(S.klass):''),5); }
});
function toast(m){ document.querySelectorAll('.toast').forEach(t=>t.remove()); const t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.innerHTML='<button class="x" aria-label="Закрыть">×</button>'+esc(m); document.body.appendChild(t); t.querySelector('.x').onclick=()=>t.remove(); setTimeout(()=>t.remove(),6000); }
window.addEventListener('afterprint',()=>{ document.getElementById('printSheet').innerHTML=''; });
function route(){ const m=location.hash.match(/r=([A-Za-z0-9_.-]+)/);
  if(m){ const j=decodeResult(m[1]); if(j){ Object.assign(S,{grade:j.grade,school:j.school,before:j.before,hero:j.hero,answers:j.answers,picks:j.picks,skills:j.skills,fb:j.fb,city:j.city,klass:j.klass,fbSent:Object.keys(j.fb).length===DATA.feedback.length,screen:'result'}); } }
  else if(/dashboard/.test(location.hash)){ dLoad(); S.screen='dashboard'; } else if(/teacher/.test(location.hash)) S.screen='teacher';
  render(); }
window.addEventListener('hashchange',route); route();

</script>
